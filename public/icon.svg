<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="aqiGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="50%" stop-color="#06b6d4" />
      <stop offset="100%" stop-color="#3b82f6" />
    </linearGradient>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  
  <!-- Rounded Squircle Background -->
  <rect width="512" height="512" rx="128" fill="url(#bgGrad)" />
  
  <!-- Circular AQI Gauge Arc -->
  <circle cx="256" cy="256" r="160" fill="none" stroke="#334155" stroke-width="24" stroke-linecap="round" />
  <path d="M 143 369 A 160 160 0 1 1 369 369" fill="none" stroke="url(#aqiGrad)" stroke-width="24" stroke-linecap="round" filter="url(#glow)" />
  
  <!-- Central Stylized Wind / Leaf Element -->
  <path d="M190 220 C190 190 230 190 270 210 C300 225 330 225 330 205 C330 195 320 185 305 185" fill="none" stroke="#38bdf8" stroke-width="18" stroke-linecap="round" />
  <path d="M160 265 C160 235 210 235 260 255 C295 270 340 270 340 245 C340 230 325 220 310 220" fill="none" stroke="#34d399" stroke-width="18" stroke-linecap="round" />
  <path d="M180 310 C180 280 220 280 250 295 C280 305 310 305 310 290" fill="none" stroke="#a7f3d0" stroke-width="18" stroke-linecap="round" />
  
  <!-- AQI Level Indicator Dot -->
  <circle cx="369" cy="369" r="18" fill="#10b981" filter="url(#glow)" />
</svg>
